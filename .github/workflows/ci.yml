name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest.log || {
            # annotations are publicly visible on the run page; raw logs are not
            grep -E '^(FAILED|ERROR)' pytest.log | head -n 10 \
              | while IFS= read -r line; do echo "::error::${line}"; done
            python - <<'EOF'
          from pathlib import Path

          tail = Path("pytest.log").read_text(errors="replace")[-3500:]
          encoded = tail.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print(f"::error title=pytest failure tail::{encoded}")
          EOF
            exit 1
          }
