[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cidx"
version = "0.1.0.dev0"
description = "Zero-config local code index for AI coding agents, with a neutral retrieval benchmark."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Gati Varshney" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
]

[project.scripts]
cidx = "cidx.cli:main"

[project.urls]
Repository = "https://github.com/gativarshney/cidx"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
]

[tool.pytest.ini_options]
testpaths = ["tests"]
