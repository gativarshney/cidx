[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cidx"
version = "0.1.0.dev0"
description = "Zero-config local code index for AI coding agents, with a neutral retrieval benchmark."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Gati Varshney" }]
requires-python = ">=3.11"
dependencies = [
    # <0.26: the 0.26.0 runtime heap-corrupts (0xC0000374) under repeated
    # QueryCursor use with current grammar wheels; 0.25.x is stable.
    "tree-sitter>=0.23,<0.26",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
]

[project.scripts]
cidx = "cidx.cli:main"

[project.urls]
Repository = "https://github.com/gativarshney/cidx"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cidx.extractors" = ["queries/*.scm"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"
# The fixture corpus is test data, not code: it deliberately contains broken
# syntax, unused imports, and undefined names for the extractors to chew on.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
]

[tool.pytest.ini_options]
testpaths = ["tests"]
